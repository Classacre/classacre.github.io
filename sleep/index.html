<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sleep</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/sleep.css">
</head>
<body>

  <main class="sleep-app">
    <header class="sleep-head">
      <h1>Sleep</h1>
      <p class="sub">Mika's sleep history · Jan – Sep 2026</p>
    </header>

    <div class="month-nav">
      <span class="month-nav__label" data-month-label>September 2026</span>
      <div class="month-nav__btns">
        <button type="button" data-nav="-1" aria-label="Previous month">&#8249;</button>
        <button type="button" data-nav="1" aria-label="Next month" disabled>&#8250;</button>
      </div>
    </div>

    <section class="stats" aria-label="Averages">
      <div class="stat stat--wide">
        <div class="stat__label">Month average</div>
        <div class="stat__num"><span data-stat="avg">–</span><small>hr</small></div>
      </div>
      <div class="stat">
        <div class="stat__label">Weekday average</div>
        <div class="stat__num"><span data-stat="wd">–</span><small>hr</small></div>
      </div>
      <div class="stat">
        <div class="stat__label">Weekend average</div>
        <div class="stat__num"><span data-stat="we">–</span><small>hr</small></div>
      </div>
      <div class="stat">
        <div class="stat__label">Best night</div>
        <div class="stat__num"><span data-stat="best">–</span><small>hr</small></div>
      </div>
      <div class="stat">
        <div class="stat__label">Worst night</div>
        <div class="stat__num"><span data-stat="worst">–</span><small>hr</small></div>
      </div>
    </section>

    <div class="legend" aria-hidden="true">
      <span>3 hr</span>
      <div class="legend-bar"></div>
      <span>8+ hr</span>
    </div>

    <section class="cal-card">
      <div class="cal" id="cal" aria-label="Sleep calendar"></div>
    </section>
  </main>

  <script type="module">
    /* Made-up data, Jan 2026 through today (Sep 6 2026).
       Jan-Jun: healthy weekdays, shorter weekends (gaming).
       Jul onward: poor weekdays (mean pinned to 3.9h),
       every Sunday becomes an 11h+ catch-up marathon. */

    const TODAY = new Date(2026, 8, 6);
    const WD_TARGET = 3.9;

    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(22938292);

    const MONTHS = [];
    {
      const cursor = new Date(2026, 0, 1);
      while (cursor <= TODAY) {
        MONTHS.push({ year: cursor.getFullYear(), month: cursor.getMonth() });
        cursor.setMonth(cursor.getMonth() + 1);
      }
    }

    const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

    const DATA = MONTHS.map(({ year, month }) => {
      const lastDay = Math.min(new Date(year, month + 1, 0).getDate(),
        (year === TODAY.getFullYear() && month === TODAY.getMonth()) ? TODAY.getDate() : 31);
      const healthy = month < 6; // before July
      const nights = [];
      for (let d = 1; d <= lastDay; d++) {
        const date = new Date(year, month, d);
        const dow = date.getDay(); // 0 = Sunday
        const weekend = dow === 0 || dow === 6;
        const key = iso(year, month, d);
        let h;
        if (healthy) {
          if (!weekend) h = 6.8 + rand() * 1.7;      // 6.8-8.5
          else if (dow === 6) h = 5 + rand() * 1.5;  // Sat 5-6.5 (gaming)
          else h = 5.5 + rand() * 1.5;               // Sun 5.5-7 (gaming)
        } else {
          if (dow === 0) h = 11 + rand() * 6;        // every Sunday 11-17
          else if (!weekend) h = 2.9 + rand() * 2.2; // 2.9-5.1
          else h = 6 + rand() * 2.5;                 // Sat 6-8.5
        }
        nights.push({ d, dow, weekend, h });
      }
      if (!healthy) {
        const wd = nights.filter((n) => !n.weekend);
        const mean = wd.reduce((s, n) => s + n.h, 0) / wd.length;
        const delta = WD_TARGET - mean;
        wd.forEach((n) => { n.h = Math.min(5.8, Math.max(2.2, n.h + delta)); });
      }
      return nights;
    });

    const colorFor = (h) => {
      const t = Math.min(1, Math.max(0, (h - 3) / 5));
      return `hsl(${Math.round(t * 135)} 85% 55%)`;
    };
    const avg = (arr) => (arr.length ? arr.reduce((s, n) => s + n.h, 0) / arr.length : 0);
    const fmt = (h) => h.toFixed(1);

    const cal = document.getElementById("cal");
    const label = document.querySelector("[data-month-label]");
    const prevBtn = document.querySelector('[data-nav="-1"]');
    const nextBtn = document.querySelector('[data-nav="1"]');
    const DOW = ["S", "M", "T", "W", "T", "F", "S"]; // Sunday-first, iOS style
    let current = DATA.length - 1; // open on current month

    function render(mi) {
      const nights = DATA[mi];
      const { year, month } = MONTHS[mi];
      label.textContent = new Date(year, month, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
      prevBtn.disabled = mi === 0;
      nextBtn.disabled = mi === DATA.length - 1;

      const wd = nights.filter((n) => !n.weekend);
      const we = nights.filter((n) => n.weekend);
      const best = nights.reduce((a, b) => (b.h > a.h ? b : a));
      const worst = nights.reduce((a, b) => (b.h < a.h ? b : a));
      document.querySelector('[data-stat="avg"]').textContent = fmt(avg(nights));
      document.querySelector('[data-stat="wd"]').textContent = fmt(avg(wd));
      document.querySelector('[data-stat="we"]').textContent = fmt(avg(we));
      document.querySelector('[data-stat="best"]').textContent = fmt(best.h);
      document.querySelector('[data-stat="worst"]').textContent = fmt(worst.h);

      const firstDow = new Date(year, month, 1).getDay(); // 0 = Sunday
      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(null);
      nights.forEach((n) => cells.push(n));
      while (cells.length % 7) cells.push(null);

      let html = DOW.map((d) => `<div class="cal__dow">${d}</div>`).join("");
      const isToday = (n) => year === TODAY.getFullYear() && month === TODAY.getMonth() && n.d === TODAY.getDate();
      cells.forEach((n) => {
        if (!n) { html += `<div class="cal__cell cal__cell--empty"></div>`; return; }
        const c = colorFor(n.h);
        html += `
          <div class="cal__cell" style="--cell-c:${c}" title="${fmt(n.h)} hours">
            <span class="cal__date${isToday(n) ? " cal__date--today" : ""}">${n.d}</span>
            <div class="cal__bars"><div class="cal__bar" style="height:${Math.min(100, (n.h / 13) * 100)}%"></div></div>
            <span class="cal__hours">${fmt(n.h)}</span>
          </div>`;
      });
      cal.innerHTML = html;
    }

    prevBtn.addEventListener("click", () => { if (current > 0) { current--; render(current); } });
    nextBtn.addEventListener("click", () => { if (current < DATA.length - 1) { current++; render(current); } });

    render(current);
  </script>
</body>
</html>
